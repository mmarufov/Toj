name: Website
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/website
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/website/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Require reproducible generated assets
        run: git diff --exit-code -- ../../docs/index.html ../../docs/assets
      - run: npm test
      - run: npm run check:budget
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
